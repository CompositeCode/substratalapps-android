# Build, test, and check that the docs still build, on every push and pull request.
# Code and docs ship together: a change that breaks the docs (a shipped screen without help, an
# API call missing from the pinned spec, a broken link) fails here.
name: Android

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:network:test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Docs toolchain
        run: python -m venv site/.venv && site/.venv/bin/pip install -r site/requirements.txt

      - name: API coverage, docs generation, strict docs build
        run: make docs
