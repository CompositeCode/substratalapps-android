# Build, test, lint, and check every API call the app's screens make against the pinned spec,
# on every push and pull request. Help pages live in the shared Hub help center
# (substratalapps-applications-specs); help-status.yml keeps this app's status there current.
name: Android

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:network:test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Every API call in the screen catalog exists in the pinned spec
        run: pip install pyyaml && make api-coverage
