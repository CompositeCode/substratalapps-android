# Keeps this app's entry in the Substratal Hub help center current.
# On every merge to main it regenerates help/apps/android.json (which screens the app has built)
# and, if it changed, opens or updates a pull request in substratalapps-applications-specs. Then it
# sends the help center an app-docs-updated dispatch so it rebuilds.
#
# Needs the secret SPECS_DOCS_TOKEN: a fine-grained token with Contents and Pull requests
# read/write on CompositeCode/substratalapps-applications-specs (see that repo's help/README.md).
name: Help status

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: help-status
  cancel-in-progress: false

env:
  SPECS_REPO: CompositeCode/substratalapps-applications-specs
  BRANCH: help-status/android

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Export build status
        run: make help-status

      - name: Open or update the help center pull request
        env:
          GH_TOKEN: ${{ secrets.SPECS_DOCS_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone "$SPECS_REPO" specs -- --depth 1
          cd specs
          mkdir -p help/apps
          if cmp -s ../build/help/android.json help/apps/android.json; then
            echo "help/apps/android.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          cp ../build/help/android.json help/apps/android.json
          git add help/apps/android.json
          git commit -m "Android build status from substratalapps-android@${GITHUB_SHA::7}"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --repo "$SPECS_REPO" >/dev/null 2>&1; then
            gh pr create --repo "$SPECS_REPO" --head "$BRANCH" --base main \
              --title "Android build status" \
              --body "Generated from CompositeCode/substratalapps-android@${GITHUB_SHA} by its help-status workflow. Updates which screens the Android app has built, shown on each screen page's **On your platform** table."
          fi

      - name: Tell the help center to rebuild
        env:
          GH_TOKEN: ${{ secrets.SPECS_DOCS_TOKEN }}
        run: |
          gh api "repos/$SPECS_REPO/dispatches" -f event_type=app-docs-updated \
            -F 'client_payload[app]=android' -F "client_payload[sha]=$GITHUB_SHA"
