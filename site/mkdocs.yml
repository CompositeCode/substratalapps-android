# Substratal Help — documentation for the Substratal management apps (Android first; Web, iOS,
# macOS, Windows and Linux share it). Built by `make docs`; published per app version with mike.
site_name: Substratal Help
site_description: Guides, tutorials, screen reference and API reference for the Substratal management apps.
site_url: https://compositecode.github.io/substratalapps-android/
repo_url: https://github.com/CompositeCode/substratalapps-android
repo_name: substratalapps-android
edit_uri: edit/main/site/docs/
copyright: Substratal Apps

docs_dir: docs
site_dir: build

theme:
  name: material
  language: en
  logo: assets/mark-white.svg
  favicon: assets/app-icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Moss Paper / Forest Floor, the apps' default themes.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/substratal.css

extra:
  # The version switcher reads versions.json, which mike writes at the site root.
  version:
    provider: mike
    default: latest
    alias: true
  api_version: "1"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CompositeCode/substratalapps.com
      name: Platform API repository

plugins:
  - search
  - swagger-ui-tag
  - mike:
      canonical_version: latest

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [".."]   # repository root, for openapi/CHANGELOG.md
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Install the app: getting-started/install.md
      - Sign in: getting-started/sign-in.md
      - Find your way around: getting-started/navigation.md
  - Tutorials:
      - tutorials/index.md
      - Invite a user: tutorials/invite-a-user.md
      - Turn off someone's access: tutorials/turn-off-access.md
      - Find out why someone can't use an app: tutorials/why-no-access.md
      - Register an application: tutorials/register-an-application.md
      - Create an API key: tutorials/create-an-api-key.md
      - Check on the API: tutorials/check-on-the-api.md
  - Guides:
      - guides/index.md
      - Users: guides/users.md
      - Access and roles: guides/access-and-roles.md
      - Applications, keys and webhooks: guides/applications.md
      - Operations: guides/operations.md
      - Audit log: guides/audit.md
      - Your account and security: guides/account-security.md
      - Appearance: guides/appearance.md
  - Reference:
      - reference/index.md
      - Screens: reference/screens/index.md
      - Permissions and roles: reference/permissions.md
      - Statuses: reference/statuses.md
      - Error messages: reference/errors.md
      - Platforms: reference/platforms.md
  - Developers:
      - developers/index.md
      - API overview: developers/api/index.md
      - API reference (version 1): developers/api/v1/index.md
      - API versions and changes: developers/api/versions.md
      - Linking to help from an app: developers/help-links.md
      - Android app architecture: developers/android.md
      - How these docs stay current: developers/docs-workflow.md
  - FAQ: faq.md
  - What's new: changelog.md
